<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Soft radial glow behind the turtle for natural dark-on-dark separation -->
    <radialGradient id="indigo-bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#352866" />
      <stop offset="100%" stop-color="#181426" />
    </radialGradient>

    <path id="shell-dome-2" d="M 122 204 C 150 112, 245 92, 326 105 C 405 118, 456 178, 459 248 C 461 286, 425 322, 375 344 C 325 366, 260 368, 225 345 C 180 315, 115 240, 122 204 Z" />
    <path id="turtle-body-2" d="M 226 300 C 214 236, 178 190, 114 190 C 54 190, 19 236, 19 294 C 19 340, 48 368, 82 379 L 71 428 C 67 450, 82 464, 112 464 C 142 464, 155 452, 154 428 L 152 392 C 182 397, 214 400, 244 401 L 246 452 C 247 476, 265 488, 293 487 C 321 486, 335 470, 333 444 L 326 382 C 352 372, 372 358, 386 347 L 388 360 C 390 380, 408 389, 432 385 C 454 381, 466 367, 463 345 L 452 290 L 491 236 C 499 222, 491 212, 476 218 L 456 227 C 452 276, 405 325, 345 344 C 295 360, 250 356, 236 334 C 230 325, 228 312, 226 300 Z" />

    <!-- Level, symmetrical lens geometries (aligned at Y=234) -->
    <path id="left-lens-2" d="M 35 234 H 97 Q 103 234 102 240 L 97 267 Q 94 284 77 284 H 55 Q 38 284 35 267 L 30 240 Q 29 234 35 234 Z" />
    <path id="right-lens-2" d="M 114 234 H 176 Q 182 234 181 240 L 176 267 Q 173 284 156 284 H 134 Q 117 284 114 267 L 109 240 Q 108 234 114 234 Z" />

    <clipPath id="shell-clip-2">
      <use href="#shell-dome-2" />
    </clipPath>
    <clipPath id="body-clip-2">
      <use href="#turtle-body-2" />
    </clipPath>
    <clipPath id="left-lens-clip-2">
      <use href="#left-lens-2" />
    </clipPath>
    <clipPath id="right-lens-clip-2">
      <use href="#right-lens-2" />
    </clipPath>
  </defs>

  <!-- ================= SQUIRCLE ICON BACKGROUND (Indigo-Slate Radial Gradient) ================= -->
  

  <g transform="translate(1, -34) scale(1)">
    <!-- Soft Ambient Drop Shadow under the sticker outline -->
    <g opacity="0.45" transform="translate(0, 14)" stroke="#07060C" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="#07060C">
      <use href="#shell-dome-2" />
      <use href="#turtle-body-2" />
      <path d="M 27 234 H 184" />
      <use href="#left-lens-2" />
    </g>

    <!-- ================= WHITE STICKER OUTLINE ================= -->
    <g id="white-outline" stroke="#EFEFF1" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="#EFEFF1">
      <use href="#shell-dome-2" />
      <use href="#turtle-body-2" />
      <path d="M 27 234 H 184" />
      <use href="#left-lens-2" />
    </g>

    <!-- ================= SHELL ================= -->
    <g id="shell">
      <use href="#shell-dome-2" fill="#6C47FF" />
      <g clip-path="url(#shell-clip-2)" fill="none" stroke="#12101B" stroke-width="20" stroke-linecap="butt" stroke-linejoin="round">
        <path d="M 205 316 C 288 334, 392 310, 468 215
                 M 154 115 L 204 176 L 285 181 L 355 150 L 368 95
                 M 355 150 L 418 202 L 468 168
                 M 204 176 L 166 268
                 M 285 181 L 301 317
                 M 418 202 L 427 254" />
      </g>
      <use href="#shell-dome-2" fill="none" stroke="#12101B" stroke-width="8" stroke-linejoin="round" />
    </g>

    <!-- ================= BODY ================= -->
    <use href="#turtle-body-2" fill="#1A1A22" />

    <!-- ================= FACE & FIXED WHITE SUNGLASSES ================= -->
    <path d="M 82 313 L 107 331 L 132 313" fill="none" stroke="#EFEFF1" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />

    <g id="sunglasses">
      <!-- Clipped Drop Shadow -->
      <g clip-path="url(#body-clip-2)">
        <g opacity="0.45" transform="translate(0, 6)">
          <path d="M 27 234 H 184" stroke="#09090C" stroke-width="8" stroke-linecap="round" />
          <path d="M 180 236 L 214 227" stroke="#09090C" stroke-width="10" stroke-linecap="round" />
          <use href="#left-lens-2" fill="#09090C" stroke="#09090C" stroke-width="4" stroke-linejoin="round" />
          <use href="#right-lens-2" fill="#09090C" stroke="#09090C" stroke-width="4" stroke-linejoin="round" />
        </g>
      </g>

      <!-- White Temple Arm & Level Brow Bar -->
      <path d="M 180 236 L 214 227" stroke="#EFEFF1" stroke-width="10" stroke-linecap="round" />
      <path d="M 27 234 H 184" stroke="#EFEFF1" stroke-width="8" stroke-linecap="round" />

      <!-- Lenses -->
      <use href="#left-lens-2" fill="#EFEFF1" stroke="#EFEFF1" stroke-width="4" stroke-linejoin="round" />
      <use href="#right-lens-2" fill="#EFEFF1" stroke="#EFEFF1" stroke-width="4" stroke-linejoin="round" />

      <!-- Dark Lens Glare -->
      <g clip-path="url(#left-lens-clip-2)">
        <polygon points="32,290 66,222 79,222 45,290" fill="#1A1A22" opacity="0.75" />
        <polygon points="52,290 86,222 92,222 58,290" fill="#1A1A22" opacity="0.45" />
      </g>
      <g clip-path="url(#right-lens-clip-2)">
        <polygon points="111,290 145,222 158,222 124,290" fill="#1A1A22" opacity="0.75" />
        <polygon points="131,290 165,222 171,222 137,290" fill="#1A1A22" opacity="0.45" />
      </g>
    </g>
  </g>
</svg>