name: Release

# Push a tag such as v0.1.0 to build the app on GitHub and attach it to a
# release, so every download can be traced to a commit and rebuilt by anyone.
# Two downloads: a zip for Windows, and an AppImage for Linux.
#
# A tag with a fourth number, such as v0.2.1.1, is a test build: a
# pre-release, with the changelog's Unreleased section as its notes. Turt
# never offers a pre-release as an update, and it compares only the first
# three numbers, so a tester on 0.2.1.1 is offered 0.2.2 when it is out.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  windows:
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test --project tests/Neap.Core.Tests -c Release

      # The program is called Turt.exe whatever the project's file is called:
      # the updater looks for the running program's name in the download and
      # starts it again after the swap.
      - name: Publish
        run: |
          $version = $env:TAG.TrimStart('v')
          dotnet publish src/Neap.Desktop -c Release -r win-x64 -f net10.0-windows10.0.19041.0 --self-contained -o publish `
            -p:Version=$version -p:ContinuousIntegrationBuild=true
          Rename-Item publish/Neap.Desktop.exe Turt.exe

      - name: Package
        run: |
          $version = $env:TAG.TrimStart('v')
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.txt publish/
          $zip = "Turt-$version-win-x64.zip"
          Compress-Archive -Path publish/* -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Out-File -Encoding ascii "$zip.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows
          path: |
            Turt-*-win-x64.zip
            Turt-*-win-x64.zip.sha256

  linux:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      # The tool that makes the AppImage, pinned to one release and checked
      # against its published hash before it is run.
      APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
      APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test --project tests/Neap.Core.Tests -c Release

      - name: Publish
        run: |
          version="${TAG#v}"
          dotnet publish src/Neap.Desktop -c Release -r linux-x64 -f net10.0 --self-contained -o publish \
            -p:Version="$version" -p:ContinuousIntegrationBuild=true

      - name: Get the AppImage tool
        run: |
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" "$APPIMAGETOOL_URL"
          echo "$APPIMAGETOOL_SHA256  $RUNNER_TEMP/appimagetool" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/appimagetool"

      - name: Package
        run: |
          version="${TAG#v}"
          APPIMAGETOOL="$RUNNER_TEMP/appimagetool" bash packaging/linux/build-appimage.sh publish "$version" dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux
          path: |
            dist/Turt-*-x86_64.AppImage
            dist/Turt-*-x86_64.AppImage.sha256

  release:
    needs: [windows, linux]
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      # The release page carries the version's changelog section, and only
      # that, so it says what changed in the same words as the repository.
      # How to install is in the README.
      - name: Notes
        run: |
          $version = $env:TAG.TrimStart('v')
          $test = $version -match '^\d+\.\d+\.\d+\.\d+$'
          $heading = if ($test) { 'Unreleased' } else { $version }
          $lines = Get-Content CHANGELOG.md
          $start = [array]::FindIndex($lines, [Predicate[string]]{ param($l) $l -match "^## $([regex]::Escape($heading))\b" })
          if ($start -lt 0) { throw "CHANGELOG.md has no section for $heading." }
          $end = [array]::FindIndex($lines, $start + 1, [Predicate[string]]{ param($l) $l -match '^## ' })
          if ($end -lt 0) { $end = $lines.Count }
          # Wrapped in @() so it stays a list of lines even when it holds one:
          # adding lines to a single string joins them all into one line, which
          # is how 0.3.0's notes came out as a single paragraph.
          $section = @($lines[($start + 1)..($end - 1)])
          if ($test) {
            $section = @(
              '**A test build,** for trying what comes next before it is released. Turt does not offer it as an update, and offers the next release once it is out.'
              ''
            ) + $section
          }
          # Release pages keep every line break, so the changelog's wrapped
          # lines are joined back into one line per paragraph or list item.
          $notes = New-Object System.Collections.Generic.List[string]
          foreach ($line in $section) {
            $previous = if ($notes.Count) { $notes[$notes.Count - 1] } else { '' }
            if ($line.Trim() -and $previous.Trim() -and $line -notmatch '^\s*(#|- |\d+\. )') {
              $notes[$notes.Count - 1] = "$previous $($line.Trim())"
            } else {
              $notes.Add($line)
            }
          }
          if ($section.Count -gt 3 -and $notes.Count -lt 3) { throw "The notes came out as $($notes.Count) lines from $($section.Count); their line breaks were lost." }
          $notes | Out-File -Encoding utf8 notes.md

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:TAG.TrimStart('v')
          $kind = if ($version -match '^\d+\.\d+\.\d+\.\d+$') { @('--prerelease', '--title', "Turt $version, test build") } else { @('--title', "Turt $version") }
          gh release create $env:TAG `
            "dist/Turt-$version-win-x64.zip" "dist/Turt-$version-win-x64.zip.sha256" `
            "dist/Turt-$version-x86_64.AppImage" "dist/Turt-$version-x86_64.AppImage.sha256" `
            @kind --notes-file notes.md
